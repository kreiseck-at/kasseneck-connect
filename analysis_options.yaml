include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Fehlende Rückgabetypen und lose dynamic-Aufrufe sind hier harte Fehler.
    always_declare_return_types: error
    avoid_dynamic_calls: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_string_buffers
